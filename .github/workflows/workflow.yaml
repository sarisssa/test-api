name: Backend & Match Processor CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
env:
  AWS_REGION: us-east-1
  API_ECR_REPOSITORY: wage-backend-ecr
  PROCESSOR_ECR_REPOSITORY: wage-match-processor-ecr
  API_CONTAINER_NAME: wage-backend-api
  PROCESSOR_CONTAINER_NAME: wage-match-processor
  ENV_NAME: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'prd') || 'dev' }}

permissions:
  id-token: write 
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::910599465842:role/github-actions-oidc-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Cache node modules
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (fail only on critical vulnerabilities)
        run: npm audit --audit-level=critical

      #TODO: Re-enable once types are added to api
      # - name: Run ESLint
      #   run: npm run lint

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Image Tags
        id: tags
        run: |
          echo "timestamp=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push API Docker image to ECR
        uses: docker/build-push-action@v5
        with:
          push: true
          context: .
          file: apps/api/Dockerfile
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.API_ECR_REPOSITORY }}:${{ github.run_id }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.API_ECR_REPOSITORY }}:${{ steps.tags.outputs.timestamp }}-${{ steps.tags.outputs.sha_short }}
            ${{ env.ENV_NAME == 'prd' && format('{0}/{1}:{2}', steps.login-ecr.outputs.registry, env.API_ECR_REPOSITORY, 'latest') || '' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init and Apply
        working-directory: infrastructure
        env:
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_twilio_account_sid: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TF_VAR_twilio_auth_token: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TF_VAR_twilio_verify_service_sid: ${{ secrets.TWILIO_VERIFY_SERVICE_SID }}
          TF_VAR_phone_hash_salt: ${{ secrets.PHONE_HASH_SALT }}
          TF_VAR_twelve_data_api_key: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          terraform init -backend-config="environments/${{ env.ENV_NAME }}.hcl"
          terraform apply -var-file=environments/${{ env.ENV_NAME }}.tfvars -auto-approve

      - name: Download API Task Definition
        run: |
          aws ecs describe-task-definition \
            --task-definition wage-backend-task-family-${{ env.ENV_NAME }} \
            --query taskDefinition > ./api-task-definition.json

      - name: Fill in the new image ID in API task definition
        id: api-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ./api-task-definition.json
          container-name: ${{ env.API_CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.API_ECR_REPOSITORY }}:${{ steps.tags.outputs.timestamp }}-${{ steps.tags.outputs.sha_short }}

      #TODO: Ensure that if task health check fails, DO NOT DEPLOY
      - name: Deploy API to Amazon ECS
        id: api-deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.api-task-def.outputs.task-definition }}
          service: wage-backend-service-${{ env.ENV_NAME }}
          cluster: wage-backend-cluster-${{ env.ENV_NAME }}
          wait-for-service-stability: true
          wait-for-minutes: 15
          force-new-deployment: true

      - name: Build and push Match Processor Docker image to ECR
        uses: docker/build-push-action@v5
        with:
          push: true
          context: .
          file: apps/match-processor/Dockerfile
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.PROCESSOR_ECR_REPOSITORY }}:${{ github.run_id }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.PROCESSOR_ECR_REPOSITORY }}:${{ steps.tags.outputs.timestamp }}-${{ steps.tags.outputs.sha_short }}
            ${{ env.ENV_NAME == 'prd' && format('{0}/{1}:{2}', steps.login-ecr.outputs.registry, env.PROCESSOR_ECR_REPOSITORY, 'latest') || '' }}

      - name: Download Match Processor Task Definition
        run: |
          aws ecs describe-task-definition \
            --task-definition wage-match-processor-task-family-${{ env.ENV_NAME }} \
            --query taskDefinition > ./match-processor-task-definition.json

      - name: Fill in the new image ID in Match Processor task definition
        id: processor-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ./match-processor-task-definition.json
          container-name: ${{ env.PROCESSOR_CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.PROCESSOR_ECR_REPOSITORY }}:${{ steps.tags.outputs.timestamp }}-${{ steps.tags.outputs.sha_short }}

      - name: Deploy Match Processor to Amazon ECS
        id: processor-deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.processor-task-def.outputs.task-definition }}
          service: wage-match-processor-service-${{ env.ENV_NAME }}
          cluster: wage-backend-cluster-${{ env.ENV_NAME }}
          wait-for-service-stability: true
          wait-for-minutes: 10
          force-new-deployment: true

      - name: Build Compute Outcome Lambda
        run: |
          mkdir -p lambda-build
          
          npx esbuild apps/api/src/step-functions/handlers/compute-outcome.ts \
            --bundle \
            --platform=node \
            --target=node20 \
            --format=esm \
            --outfile=lambda-build/compute-outcome.mjs \
            --external:@aws-sdk/*
          
          cd lambda-build
          zip -q compute-outcome.zip compute-outcome.mjs
          echo "✅ compute-outcome.zip created ($(du -h compute-outcome.zip | cut -f1))"

      - name: Build Broadcast Completion Lambda
        run: |
          # Install ioredis temporarily for bundling
          npm install ioredis --no-save
          
          npx esbuild apps/api/src/step-functions/handlers/broadcast-completion.ts \
            --bundle \
            --platform=node \
            --target=node20 \
            --format=esm \
            --outfile=lambda-build/broadcast-completion.mjs \
            --external:@aws-sdk/*
          
          cd lambda-build
          zip -q broadcast-completion.zip broadcast-completion.mjs
          echo "✅ broadcast-completion.zip created ($(du -h broadcast-completion.zip | cut -f1))"

      - name: Deploy Lambda Functions
        run: |
          echo "🚀 Deploying Compute Outcome Lambda..."
          aws lambda update-function-code \
            --function-name wage-compute-outcome-${{ env.ENV_NAME }} \
            --zip-file fileb://lambda-build/compute-outcome.zip
          
          aws lambda wait function-updated \
            --function-name wage-compute-outcome-${{ env.ENV_NAME }}
          
          echo "✅ Compute Outcome Lambda deployed"
          
          echo "🚀 Deploying Broadcast Completion Lambda..."
          aws lambda update-function-code \
            --function-name wage-broadcast-completion-${{ env.ENV_NAME }} \
            --zip-file fileb://lambda-build/broadcast-completion.zip
          
          aws lambda wait function-updated \
            --function-name wage-broadcast-completion-${{ env.ENV_NAME }}
          
          echo "✅ Broadcast Completion Lambda deployed"
          echo "🎉 All Lambda functions deployed successfully!"
