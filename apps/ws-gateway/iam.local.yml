statements:
  - Effect: Allow
    Action:
      - dynamodb:PutItem
      - dynamodb:DeleteItem
      - dynamodb:GetItem
      - dynamodb:Query
    Resource:
      - Fn::GetAtt: [ConnectionsTable, Arn]
      - Fn::Join:
          - ''
          - - Fn::GetAtt: [ConnectionsTable, Arn]
            - '/*'
